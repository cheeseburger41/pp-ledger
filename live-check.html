<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vici · live feed check</title>
<style>
body { margin: 0; padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 40px; background: #050506; color: #e6e7ea; font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
h1 { font-weight: 300; letter-spacing: .32em; text-transform: uppercase; font-size: 20px; margin: 0 0 16px; color: #d6d8dc; }
p { margin: 0 0 16px; }
table { border-collapse: collapse; width: 100%; }
td { padding: 10px 0; border-bottom: 1px solid #1f2024; vertical-align: top; }
td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 14px; white-space: nowrap; padding-left: 12px; }
.ok { color: #4fd18b; } .bad { color: #ff6b6b; }
.sum { margin: 18px 0 0; color: #9a9da4; font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>Vici</h1>
<p id="s">Checking ESPN's feed from this device…</p>
<table id="t"></table>
<p class="sum" id="ua"></p>
<script>
// One-off check for the Live view: can this device read ESPN's public JSON directly? Same request shape as the app (plain GET, no credentials, no custom headers).
const T = [
  ["Today's NBA games", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard"],
  ["An NBA box score", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401910002"],
  ["College football games", "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard"],
  ["Soccer leagues", "https://site.web.api.espn.com/apis/v2/scoreboard/header?sport=soccer"],
  ["Player search", "https://site.web.api.espn.com/apis/common/v3/search?query=curry&limit=1"]];
(async () => {
  let good = 0; const t = document.getElementById("t");
  for (const [name, u] of T) {
    const tr = t.insertRow(); tr.insertCell().textContent = name; const c = tr.insertCell(); c.textContent = "…";
    try { const t0 = Date.now(); const r = await fetch(u, { mode: "cors", credentials: "omit" }); const txt = await r.text(); const ok = r.ok && txt.trim().startsWith("{");
      if (ok) good++; c.textContent = (ok ? "OK " : "Error ") + r.status + " · " + (Date.now() - t0) + " ms"; c.className = ok ? "ok" : "bad"; }
    catch (e) { c.textContent = "Refused"; c.className = "bad"; }
  }
  document.getElementById("s").textContent = good === T.length ? "All good: the Live view can run on ESPN's free feed from this device."
    : good === 0 ? "ESPN refuses every request from this device, so the free feed can't carry the Live view."
    : `${good} of ${T.length} answered. Send Claude this screen.`;
  document.getElementById("ua").textContent = navigator.userAgent;
})();
</script>
</body>
</html>
